<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>正分子营养 · 科普聚合站</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#F5F4F0;color:#333}
.maxw{max-width:640px;margin:0 auto;padding:16px}

/* ===== 顶部 ===== */
.topbar{background:linear-gradient(160deg,#4A3220,#7A5226 30%,#C4953A 65%,#E0B15A);color:#fff;border-radius:18px;padding:30px 22px;text-align:center;margin-bottom:16px}
.topbar h1{font-size:24px;margin-bottom:6px}
.topbar .sub{font-size:14px;opacity:.75}

/* ===== 首页产品列表 ===== */
.home{display:block}
.home-title{font-size:18px;font-weight:700;color:#2C3040;margin:6px 4px 12px}
.p-list{display:flex;flex-direction:column;gap:10px}
.p-item{background:#fff;border:1px solid #D8DCE0;border-radius:14px;padding:16px 18px;cursor:pointer;transition:all .15s;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,.03)}
.p-item:hover{border-color:#C4953A;box-shadow:0 2px 10px rgba(196,149,58,.12)}
.p-item .p-name{font-size:17px;font-weight:600;color:#2C3040}
.p-item .p-code{font-size:12px;color:#A0A8B0;margin-top:3px}
.p-item .p-arrow{color:#C4953A;font-size:20px}

/* ===== 产品页 ===== */
.product{display:none}
.p-back{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid #D8DCE0;border-radius:10px;padding:8px 14px;font-size:14px;color:#555;cursor:pointer;margin-bottom:12px}
.p-back:hover{border-color:#C4953A;color:#C4953A}
.p-head{background:#fff;border:1px solid #D8DCE0;border-radius:14px;padding:18px;margin-bottom:12px}
.p-head .p-name{font-size:20px;font-weight:700;color:#2C3040}
.p-head .p-code{font-size:13px;color:#A0A8B0;margin-top:4px}

/* ===== Tab切换 ===== */
.tab-bar{display:flex;gap:6px;margin-bottom:14px}
.tab-btn{flex:1;padding:10px 6px;border-radius:10px;border:1px solid #D8DCE0;background:#fff;font-size:15px;color:#666;cursor:pointer;font-weight:600;transition:all .15s}
.tab-btn.active{background:linear-gradient(135deg,#C4953A,#A87A2E);color:#fff;border-color:#C4953A}
.tab-pane{display:none}
.tab-pane.active{display:block}

/* ===== 操作栏：分享/二维码 ===== */
.action-bar{display:flex;gap:8px;margin:14px 0}
.act-btn{flex:1;padding:11px 8px;border-radius:10px;border:none;font-size:15px;cursor:pointer;font-weight:600;transition:all .15s}
.act-share{background:#2C3040;color:#fff}
.act-share:hover{background:#3D4354}
.act-qr{background:#fff;border:1px solid #C4953A;color:#C4953A}
.act-qr:hover{background:#FCF6E8}
.act-copy{background:#fff;border:1px solid #D8DCE0;color:#666}
.act-copy:hover{border-color:#C4953A;color:#C4953A}

/* ===== 二维码弹窗 ===== */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:999;display:none;justify-content:center;align-items:center;padding:20px}
.modal.show{display:flex}
.modal-box{background:#fff;border-radius:16px;padding:26px 24px;text-align:center;max-width:320px;width:100%}
.modal-box h3{font-size:18px;color:#2C3040;margin-bottom:4px}
.modal-box .modal-url{font-size:12px;color:#999;word-break:break-all;margin:8px 0 12px;background:#F5F4F0;padding:8px 10px;border-radius:8px}
.modal-box #qrBox{display:flex;justify-content:center;margin-bottom:12px}
.modal-box .qr-hint{font-size:13px;color:#666;margin-bottom:12px}
.modal-box .qr-actions{display:flex;gap:8px}
.modal-box .qr-actions button{flex:1;padding:9px;border-radius:8px;border:none;font-size:14px;cursor:pointer;font-weight:600}
.modal-close{background:#F0F0F0;color:#666}
.modal-dl{background:#C4953A;color:#fff}
.modal-cp{background:#2C3040;color:#fff}

/* ===== 内容区样式（统一容器，内容自由） ===== */
.pv-view{line-height:1.8}
.pv-card{background:#fff;border:1px solid #D8DCE0;border-radius:14px;padding:18px;margin-bottom:12px}
.pv-card-title{font-size:17px;font-weight:700;color:#2C3040;margin-bottom:12px;padding-left:10px;border-left:4px solid #C4953A}
.pv-note{font-size:15px;color:#3a3a3a;line-height:1.8}
.pv-spec-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.pv-spec{background:#F5F4F0;border-radius:10px;padding:14px 10px;text-align:center}
.pv-spec-label{font-size:13px;color:#8890A0;margin-bottom:4px}
.pv-spec-value{font-size:18px;font-weight:700;color:#2C3040}
.pv-spec-sub{font-size:13px;color:#8890A0;margin-top:2px}
.pv-row{display:flex;gap:12px;padding:8px 0;font-size:15px;color:#3a3a3a;line-height:1.7}
.pv-ic{flex-shrink:0;width:26px;height:26px;border-radius:50%;background:#E8C87A;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#2C3040;margin-top:2px}
.pv-hint{font-size:13px;color:#8890A0;margin:10px 0 4px}
.pv-table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
.pv-table th{background:#8B5E3C;color:#fff;padding:8px 6px;text-align:center;font-weight:600}
.pv-table td{padding:8px 6px;border-bottom:1px solid #E8E4DC;text-align:center}
.pv-table tr:nth-child(even) td{background:#F9F7F2}
.pv-accent{background:#FCF6E8;border:1px solid #E8C87A;border-left:4px solid #C4953A;border-radius:10px;padding:12px 14px;font-size:14px;color:#3a3a3a;line-height:1.7;margin:10px 0}
.pv-tip{background:#F5F4F0;border-radius:10px;padding:12px 14px;font-size:14px;color:#3a3a3a;line-height:1.7;margin:10px 0}
.pv-banner{background:#2C3040;color:#FFF6E5;border-radius:10px;padding:12px 14px;font-size:15px;text-align:center;margin:10px 0}
.pv-notice{font-size:14px;color:#3a3a3a;line-height:1.9}
.pv-benefit{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid #F0EDE6;font-size:15px;color:#3a3a3a;line-height:1.7}
.pv-benefit:last-child{border-bottom:none}
.pv-b-icon{flex-shrink:0;width:36px;height:36px;border-radius:10px;background:#FCF6E8;display:flex;align-items:center;justify-content:center;font-size:18px}
.pv-muted{color:#6b6b6b}
.pv-list{padding:4px 0 4px 4px}
.pv-list div{padding:6px 0;font-size:15px;color:#3a3a3a;line-height:1.7;padding-left:14px;border-left:2px solid #E8C87A;margin:6px 0}
.pv-flow{background:#F5F4F0;border-radius:10px;padding:14px;font-size:14px;color:#555;line-height:1.8;margin:8px 0;border:1px dashed #D8DCE0}
.pv-faq{padding:10px 0;border-bottom:1px solid #F0EDE6;font-size:14px;line-height:1.7}
.pv-faq:last-child{border-bottom:none}
.pv-summary{background:linear-gradient(135deg,#FCF6E8,#F5F4F0);border:1px solid #E8C87A;border-radius:12px;padding:16px;text-align:center;font-size:15px;color:#2C3040;line-height:1.7}
.pv-hero{background:linear-gradient(135deg,#C4953A,#A87A2E);color:#fff;border-radius:14px;padding:22px 18px;text-align:center;margin-bottom:12px}
.pv-hero-title{font-size:20px;font-weight:700;margin-bottom:6px}
.pv-hero-sub{font-size:14px;opacity:.85}
.pv-ref{font-size:12px;color:#5c5c5c;line-height:1.9}

/* ===== 底部 ===== */
.footer{text-align:center;font-size:13px;color:#A0A8B0;margin-top:24px;padding-top:14px;border-top:1px solid #E0DED8;line-height:1.7}

/* ===== 加载/状态 ===== */
.loading{text-align:center;padding:60px 0;color:#999;font-size:16px}
.loading .spin{display:inline-block;width:30px;height:30px;border:3px solid #E0DED8;border-top-color:#C4953A;border-radius:50%;animation:sp .8s linear infinite;margin-bottom:10px}
@keyframes sp{to{transform:rotate(360deg)}}
.err{text-align:center;padding:40px 0;color:#C07A5A;font-size:15px}

@media(max-width:480px){
  .pv-spec-grid{grid-template-columns:1fr 1fr}
  .tab-btn{font-size:14px;padding:9px 4px}
  .topbar{padding:24px 16px}
}
</style>
</head>
<body>
<div class="maxw">

<!-- 顶部 -->
<div class="topbar">
  <h1>🥗 正分子营养 · 科普聚合站</h1>
  <div class="sub">产品使用说明 · 功用科普（简单版 / 专业版）</div>
</div>

<!-- 加载提示 -->
<div class="loading" id="loadingBox"><div class="spin"></div><div>正在加载产品数据...</div></div>

<!-- 首页 -->
<div class="home" id="homeView">
  <div class="home-title">产品列表</div>
  <div class="p-list" id="pList"></div>
</div>

<!-- 产品页 -->
<div class="product" id="productView">
  <button class="p-back" onclick="goHome()">← 返回产品列表</button>
  <div class="p-head" id="pHead"></div>
  <div class="tab-bar" id="tabBar"></div>
  <div class="tab-pane" id="pane"></div>
  <div class="action-bar">
    <button class="act-btn act-share" onclick="shareView()">🔗 分享</button>
    <button class="act-btn act-qr" onclick="openQR()">▦ 二维码</button>
    <button class="act-btn act-copy" onclick="copyLink()">📋 复制链接</button>
  </div>
</div>

<!-- 二维码弹窗 -->
<div class="modal" id="qrModal" onclick="if(event.target===this)closeQR()">
  <div class="modal-box">
    <h3>扫码查看</h3>
    <div class="modal-url" id="qrUrl"></div>
    <div id="qrBox"></div>
    <div class="qr-hint">长按二维码图片可保存，放到公众号即可</div>
    <div class="qr-actions">
      <button class="modal-close" onclick="closeQR()">关闭</button>
      <button class="modal-cp" onclick="copyLink()">复制链接</button>
      <button class="modal-dl" onclick="downloadQR()">保存图片</button>
    </div>
  </div>
</div>

<!-- 底部 -->
<div class="footer">
  本平台所有内容为科普信息整理，仅供科研参考与信息分享，不构成医疗建议或疾病诊疗依据。<br>
  请结合专业医师或营养师意见判断。© 2026 正分子营养
</div>

<script>
// ====== 配置：数据源（GitHub → jsdelivr CDN） ======
var DATA_URL = 'https://cdn.jsdelivr.net/gh/liuchenyu26131/kepu@main/products.json';

var PRODUCTS = [];
var curProduct = null;
var curView = 'detail';

// ====== 加载数据（先试本地 products.json，再走 CDN） ======
function loadData(){
  var x = new XMLHttpRequest();
  x.open('GET', 'products.json', true);
  x.overrideMimeType('application/json');
  x.onload = function(){
    if(x.status===0 || x.status===200){
      try{ PRODUCTS = JSON.parse(x.responseText); init(); return; }catch(e){}
    }
    loadFromCDN();
  };
  x.onerror = function(){ loadFromCDN(); };
  x.send();
}
function loadFromCDN(){
  var x = new XMLHttpRequest();
  x.open('GET', DATA_URL, true);
  x.overrideMimeType('application/json');
  x.onload = function(){
    if(x.status===0 || x.status===200){
      try{ PRODUCTS = JSON.parse(x.responseText); init(); return; }catch(e){}
    }
    document.getElementById('loadingBox').innerHTML = '<div class="err">数据加载失败，请检查网络或数据源配置</div>';
  };
  x.onerror = function(){
    document.getElementById('loadingBox').innerHTML = '<div class="err">数据加载失败，请检查网络或数据源配置</div>';
  };
  x.send();
}

// ====== 初始化 ======
function init(){
  document.getElementById('loadingBox').style.display = 'none';
  renderHome();
  // 支持 URL 锚点直接进入产品： #产品id-视图名 例如 #tb-detail / #tb-simple / #tb-pro
  var h = window.location.hash;
  if(h && h.length>1){
    var parts = h.substring(1).split('-');
    var id = parts[0], view = parts[1];
    if(PRODUCTS.some(function(p){return p.id===id;})){
      openProduct(id, view);
    }
  }
}

// ====== 首页渲染 ======
function renderHome(){
  var list = document.getElementById('pList');
  list.innerHTML = PRODUCTS.map(function(p){
    return '<div class="p-item" onclick="openProduct(\''+p.id+'\',\'detail\')">'+
      '<div><div class="p-name">'+p.name+'</div><div class="p-code">编号 '+p.code+' · '+(p.views?Object.keys(p.views).length:0)+' 个视图</div></div>'+
      '<span class="p-arrow">›</span></div>';
  }).join('');
}

// ====== 打开产品 ======
function openProduct(id, view){
  for(var i=0;i<PRODUCTS.length;i++) if(PRODUCTS[i].id===id){ curProduct=PRODUCTS[i]; break; }
  if(!curProduct) return;
  curView = view || 'detail';
  if(!curProduct.views[curView]) curView = Object.keys(curProduct.views)[0];
  document.getElementById('homeView').style.display='none';
  document.getElementById('productView').style.display='block';
  document.getElementById('pHead').innerHTML = '<div class="p-name">'+curProduct.name+'</div><div class="p-code">编号 '+curProduct.code+'</div>';
  // tab
  var tabBar = document.getElementById('tabBar');
  tabBar.innerHTML = '';
  var vkeys = Object.keys(curProduct.views);
  vkeys.forEach(function(k){
    var btn = document.createElement('button');
    btn.className = 'tab-btn'+(k===curView?' active':'');
    btn.textContent = curProduct.views[k].title;
    btn.onclick = function(){ switchView(k); };
    tabBar.appendChild(btn);
  });
  showView(curView);
  window.scrollTo(0,0);
}

// ====== 切换视图 ======
function switchView(k){
  curView = k;
  document.querySelectorAll('#tabBar .tab-btn').forEach(function(b,i){
    b.classList.toggle('active', Object.keys(curProduct.views)[i]===k);
  });
  showView(k);
  // 更新地址栏锚点（便于分享）
  history.replaceState(null,'', '#'+curProduct.id+'-'+k);
}
function showView(k){
  document.getElementById('pane').innerHTML = curProduct.views[k].html;
}

// ====== 返回首页 ======
function goHome(){
  document.getElementById('productView').style.display='none';
  document.getElementById('homeView').style.display='block';
  history.replaceState(null,'', location.pathname);
  curProduct = null;
  window.scrollTo(0,0);
}

// ====== 当前视图链接 ======
function currentLink(){
  if(!curProduct) return location.href.split('#')[0];
  return location.href.split('#')[0] + '#' + curProduct.id + '-' + curView;
}

// ====== 分享（复制链接） ======
function shareView(){
  copyLink();
}
function copyLink(){
  var url = currentLink();
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(function(){
      toast('已复制链接');
    }).catch(function(){ prompt('复制以下链接：', url); });
  } else {
    prompt('复制以下链接：', url);
  }
}

// ====== 二维码 ======
function openQR(){
  var url = currentLink();
  document.getElementById('qrUrl').textContent = url;
  var box = document.getElementById('qrBox');
  box.innerHTML = '';
  new QRCode(box, {text: url, width: 200, height: 200, colorDark:'#2C3040', colorLight:'#ffffff'});
  document.getElementById('qrModal').classList.add('show');
}
function closeQR(){ document.getElementById('qrModal').classList.remove('show'); }
function downloadQR(){
  var img = document.querySelector('#qrBox img');
  if(!img) return;
  var a = document.createElement('a');
  a.download = (curProduct?curProduct.name:'链接') + '_二维码.png';
  a.href = img.src;
  a.click();
}

// ====== 轻提示 ======
function toast(msg){
  var t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;top:20%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:10px 20px;border-radius:10px;font-size:14px;z-index:99999;transition:opacity .3s';
  document.body.appendChild(t);
  setTimeout(function(){ t.style.opacity='0'; setTimeout(function(){ t.remove(); }, 300); }, 1500);
}

// ====== 启动 ======
loadData();
</script>
</body>
</html>
